spring:
  datasource:
    url: jdbc:h2:mem:mobile_banking;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  flyway:
    enabled: false
  data:
    redis:
      repositories:
        enabled: false

bank:
  demo-enabled: false
  security:
    redis-rate-limit-enabled: false

management:
  health:
    redis:
      enabled: false
