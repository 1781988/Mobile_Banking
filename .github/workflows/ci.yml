name: CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compile and test
        run: mvn -B -ntp clean verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-and-api-test-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

  mysql-migration-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: mobile_banking
          MYSQL_USER: bank_app
          MYSQL_PASSWORD: ci_bank_password
          MYSQL_ROOT_PASSWORD: ci_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_root_password --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    env:
      CI_MYSQL: "true"
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/mobile_banking?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: bank_app
      SPRING_DATASOURCE_PASSWORD: ci_bank_password
      BANK_DEMO_ENABLED: "false"
      BANK_SECURITY_REDIS_RATE_LIMIT_ENABLED: "false"
      MANAGEMENT_HEALTH_REDIS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Validate Flyway migration and JPA mapping against MySQL
        run: mvn -B -ntp -Dtest=MySqlMigrationTest test
